# Example cam15 profile. Copy the event options into the existing camera config;
# retain its real endpoint, credentials, and recording/timelapse settings.
camera_id 15
camera_name cam15
camera_url http://192.0.2.15:2020/onvif/device_service
camera_userpass user:password
media_transport onvif
events on
events_topics CellMotionDetector/Motion,PeopleDetector/People,TPSmartEventDetector/TPSmartEvent
onvif_state_ttl 30
event_gap 30
movie_max_time 600
motion_detection off
decode_frames auto
movie_passthrough on
movie_codec copy
